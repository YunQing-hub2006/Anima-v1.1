[project]
name = "anima"
version = "1.3.0"
description = "Anima 插件内核：零外部依赖的插件生命周期、事件总线与服务注册表"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anima*"]

# PEP 561：让 mypy / pyright 使用本包内联的类型注解（配合 anima/py.typed）。
[tool.setuptools.package-data]
anima = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["anima.core"]

[tool.coverage.report]
show_missing = false
